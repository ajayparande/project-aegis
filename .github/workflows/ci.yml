
name: Project Aegis CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-checks:
    name: Tests and Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install project and dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Run automated tests
        run: python -m pytest -v

      - name: Check linting
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check types
        run: python -m mypy src

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check diff whitespace
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$PUSH_BEFORE_SHA" "$GITHUB_SHA"
          else
            git show --check --format= "$GITHUB_SHA"
          fi

      - name: Validate gitignore rules
        shell: bash
        run: |
          set -e

          mkdir -p .venv data logs
          touch .env .venv/probe.txt data/aegis.db logs/aegis.log

          git check-ignore -q --no-index .env
          git check-ignore -q --no-index .venv/probe.txt
          git check-ignore -q --no-index data/aegis.db
          git check-ignore -q --no-index logs/aegis.log

          if git check-ignore -q --no-index .env.example; then
            echo "ERROR: .env.example must not be ignored"
            exit 1
          fi

          echo "All .gitignore checks passed."
